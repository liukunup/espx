## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version (esp_mqtt 1.1.0 requires >=5.3)
  idf:
    version: '>=5.3'
  ## Espressif components from registry:
  espressif/qrcode: ^0.2.0
  espressif/network_provisioning: ^1.2.0
  espressif/led_indicator: ^2.1.0
  espressif/i2c_bus: ^1.5.0
  espressif/esp_delta_ota: ^1.1.0
  espressif/mqtt: ^1.1.0
  espressif/mdns: ^1.0.0
  ## Note: esp_https_server is built-in IDF component (no download needed)
  ## esp-now component provides high-level ESP-NOW API
  espressif/esp-now: ^2.5.3
